services:
  postgres:
    image: postgres:16-alpine
    container_name: novacart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacart
      POSTGRES_USER: novacart
      POSTGRES_PASSWORD: novacart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
