name: QA Smoke Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novacart
          POSTGRES_USER: novacart
          POSTGRES_PASSWORD: novacart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novacart -d novacart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql+psycopg://novacart:novacart@127.0.0.1:5432/novacart#' .env || true

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Start FastAPI app
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 5

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application failed to start"
          cat uvicorn.log
          exit 1

      - name: Install Playwright browser
        working-directory: postman
        run: |
          npm install
          node ./node_modules/playwright/cli.js install chromium

      - name: Run Playwright smoke tests
        working-directory: postman
        run: node ./node_modules/@playwright/test/cli.js test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: postman/playwright-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: postman/test-results

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: uvicorn.log
